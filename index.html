<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PH MUSIC</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#00ff66">
</head>

<body>

  <!-- Overlay para fechar o menu no celular ao clicar fora -->
  <div id="sidebar-overlay" class="sidebar-overlay"></div>

  <div id="app">
    <!-- MENU LATERAL -->
    <aside class="sidebar" id="sidebar">
      <div class="logo">
        <span>🎵</span>
        <h1>PH MUSIC</h1>
      </div>
      <nav>
        <button class="menu active">🏠 Início</button>
        <button id="btn-pastas" class="menu">📁 Procurar por Pastas</button>
        <button class="menu">🎤 Artistas</button>
        <button class="menu">💿 Álbuns</button>
        <button class="menu">❤️ Favoritas</button>
      </nav>
    </aside>

    <!-- CONTEÚDO PRINCIPAL -->
    <main>
      <header>
        <!-- Botão Hamburguer para Mobile -->
        <button id="btn-menu-toggle" class="btn-menu-toggle" aria-label="Abrir Menu">☰</button>
        <input id="search" type="text" placeholder="Pesquisar músicas...">
      </header>

      <section class="banner">
        <div>
          <h2>Bem-vindo ao PH MUSIC</h2>
          <p>Sua biblioteca musical pessoal.</p>
        </div>
      </section>

      <section class="secao-musicas">
        <h2 id="titulo-secao" class="titulo">Todas as músicas</h2>
        <div id="lista-musicas" class="lista"></div>
      </section>
    </main>
  </div>

  <!-- MODAL DE NAVEGAÇÃO POR PASTAS -->
  <div id="modal-pastas" class="modal-overlay hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h3>📂 Pastas</h3>
        <button id="btn-fechar-modal" class="btn-close">&times;</button>
      </div>
      <div id="caminho-atual" class="caminho-atual">/</div>
      <div id="conteudo-pastas" class="lista-pastas"></div>
    </div>
  </div>

  <!-- PLAYER FOOTER RESPONSIVO -->
  <footer class="player">
    <div class="player-left">
      <div id="info">Nenhuma música selecionada</div>
    </div>

    <div class="player-center">
      <div class="controles-midia">
        <button id="btn-prev" class="btn-ctrl" title="Anterior">⏮️</button>
        <audio id="audio" controls crossorigin="anonymous"></audio>
        <button id="btn-next" class="btn-ctrl" title="Próxima">⏭️</button>
      </div>
    </div>

    <!-- EQUALIZADOR INTEGRADO -->
    <div class="player-right">
      <button id="btn-toggle-eq" class="btn-eq-toggle">🎛️ EQ</button>
      <div class="equalizador hidden-mobile" id="equalizador-box">
        <div class="eq-control">
          <label for="eq-grave">Grave</label>
          <input type="range" id="eq-grave" min="-12" max="12" value="0" step="0.5">
        </div>
        <div class="eq-control">
          <label for="eq-medio">Médio</label>
          <input type="range" id="eq-medio" min="-12" max="12" value="0" step="0.5">
        </div>
        <div class="eq-control">
          <label for="eq-agudo">Agudo</label>
          <input type="range" id="eq-agudo" min="-12" max="12" value="0" step="0.5">
        </div>
      </div>
    </div>
  </footer>

  <script src="config.js"></script>
  <script src="api.js"></script>
  <script src="player.js"></script>
  <script src="app.js"></script>

</body>

</html>
